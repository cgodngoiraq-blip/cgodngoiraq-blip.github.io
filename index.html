<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظمة إبداع الأجيال للتنمية والتطوير - CGOD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* الألوان السيادية الجديدة للمنظمة */
            --primary-color: #0c1e36;
            --primary-light: #163257;
            --accent-color: #c5a028;
            --accent-hover: #a3821a;
            --text-main: #2b3641;
            --text-muted: #626e7b;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 30px rgba(12,30,54,0.05);
            --shadow-lg: 0 20px 40px rgba(12,30,54,0.08);
            --radius: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* حركات الأنميشن */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-up {
            animation: fadeInUp 1s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            opacity: 0;
        }
        
        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.45s; }
        .delay-4 { animation-delay: 0.6s; }

        /* الهيدر والقائمة */
        header {
            background-color: var(--primary-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            border-bottom: 2px solid var(--accent-color);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* تنسيق صورة المنظمة */
        .org-logo-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            background-color: var(--white);
            border-radius: 50%;
            padding: 5px;
            border: 2px solid var(--accent-color);
        }

        .logo-text h1 {
            font-size: 1.3rem;
            color: var(--accent-color);
            font-weight: 900;
        }

        .logo-text span {
            color: var(--white);
            font-size: 11px;
            display: block;
            margin-top: -2px;
            opacity: 0.8;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            margin-right: 25px;
            font-size: 15px;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* القسم الرئيسي (الواجهة) */
        .hero {
            background: linear-gradient(135deg, rgba(12,30,54,0.95) 0%, rgba(22,50,87,0.9) 100%), url('https://images.unsplash.com/photo-1593113512633-288225586616?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            background-attachment: fixed;
            height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            border-bottom: 5px solid var(--primary-color);
            position: relative;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            padding: 20px;
        }

        .hero-content h2 {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            color: var(--white);
        }

        .hero-content p {
            font-size: 1.3rem;
            margin-bottom: 35px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            opacity: 0.9;
        }

        /* الأزرار */
        .btn-main {
            background-color: var(--accent-color);
            color: var(--primary-color);
            padding: 14px 35px;
            font-size: 1.1rem;
            border-radius: var(--radius);
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(197,160,40,
