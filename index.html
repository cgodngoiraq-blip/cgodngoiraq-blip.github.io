<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظمة إبداع الأجيال للتنمية والتطوير - CGOD</title>
    <style>
        :root {
            --primary-color: #0c1e36;
            --primary-light: #163257;
            --accent-color: #c5a028;
            --accent-hover: #a3821a;
            --text-main: #2b3641;
            --text-muted: #626e7b;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 30px rgba(12,30,54,0.05);
            --shadow-lg: 0 20px 40px rgba(12,30,54,0.08);
            --radius: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.7;
        }

        header {
            background-color: var(--primary-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            border-bottom: 2px solid var(--accent-color);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .brand h1 {
            color: var(--accent-color);
            font-size: 22px;
            font-weight: 700;
        }

        .brand span {
            color: var(--white);
            font-size: 11px;
            display: block;
            margin-top: -2px;
            opacity: 0.8;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            margin-right: 25px;
            font-size: 15px;
            font-weight: 600;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .hero-section {
            background: linear-gradient(135deg, rgba(12,30,54,0.95) 0%, rgba(22,50,87,0.9) 100%), url('Gemini_Generated_Image_huyp6xhuyp6xhuyp.jpg') no-repeat center center/cover;
            color: var(--white);
            padding: 120px 0;
            text-align: center;
        }

        .hero-section h2 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .hero-section p {
            font-size: 18px;
            max-width: 850px;
            margin: 0 auto 35px auto;
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: var(--primary-color);
            padding: 14px 35px;
            border-radius: var(--radius);
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(197,160,40,0.3);
            transition: var(--transition);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .badge-sovereign {
            background: var(--white);
            border-right: 6px solid var(--accent-color);
            padding: 25px 30px;
            margin: -40px auto 50px auto;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .badge-icon {
            font-size: 35px;
            background: #fdfaf2;
            padding: 10px;
            border-radius: 50%;
        }

        .badge-text h3 {
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 5px;
        }

        .badge-text p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .title-block {
            text-align: center;
            margin: 60px 0 40px 0;
        }

        .title-block h3 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 700;
            position: relative;
            display: inline-block;
            padding-bottom: 12px;
        }

        .title-block h3::after {
            content: '';
            width: 50px;
            height: 3px;
            background-color: var(--accent-color);
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        /* صندوق نداء الشراكات والتمويل ودعم الحملات والمبادرات */
        .sponsorship-portal {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: var(--white);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            margin: 40px 0;
            border: 2px solid var(--accent-color);
            position: relative;
            overflow: hidden;
        }

        .sponsorship-portal::before {
            content: '🤝';
            position: absolute;
            left: -20px;
            bottom: -20px;
            font-size: 140px;
            opacity: 0.05;
        }

        .sponsorship-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .sponsorship-content {
            flex: 1;
            min-width: 300px;
        }

        .sponsorship-content h4 {
            color: var(--accent-color);
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .sponsorship-content p {
            font-size: 15px;
            line-height: 1.7;
            opacity: 0.95;
        }

        .btn-gold {
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 14px 30px;
            border-radius: var(--radius);
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            transition: var(--transition);
        }

        .btn-gold:hover {
            background: var(--accent-color);
            color: var(--primary-color);
            box-shadow: 0 4px 15px rgba(197,160,40,0.4);
            transform: translateY(-2px);
        }

        .flex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .ui-card {
            background-color: var(--white);
            padding: 30px 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border-top: 4px solid transparent;
            transition: var(--transition);
        }

        .ui-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-top-color: var(--accent-color);
        }

        .ui-card h4 {
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .ui-card p {
            color: var(--text-muted);
            font-size: 14px;
            text-align: justify;
        }

        .governance-block {
            background-color: var(--white);
            padding: 35px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            margin-bottom: 50px;
            text-align: center;
        }

        .governance-block p {
            max-width: 950px;
            margin: 0 auto;
            font-size: 16px;
        }

        .liaison-panel {
            background-color: var(--white);
            padding: 40px 35px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            margin-bottom: 60px;
            border-left: 5px solid var(--primary-light);
        }

        .liaison-panel h4 {
            color: var(--primary-color);
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .liaison-list {
            list-style: none;
        }

        .liaison-list li {
            padding: 15px 0;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            font-size: 15px;
        }

        .liaison-list li:last-child {
            border-bottom: none;
        }

        .liaison-icon {
            font-size: 16px;
            background: #ebf4ff;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .contact-section {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 50px 0;
            border-top: 4px solid var(--accent-color);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
        }

        .contact-box h5 {
            color: var(--accent-color);
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .contact-box p {
            font-size: 14px;
            opacity: 0.9;
        }

        footer {
            background-color: #061120;
            color: #718096;
            text-align: center;
            padding: 25px 0;
